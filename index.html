
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Frontier Radar｜AI 前沿情报站</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #e4e9f1;
      --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }
    .container {
      max-width: 1100px;
      padding: 0 22px;
      margin: auto;
    }
    header {
      background: #111b32;
      color: white;
      padding: 42px 0;
    }
    header h1 { margin: 0; font-size: 34px; }
    header p { color: #cbd5e1; }
    .tagline { font-size: 13px; letter-spacing: 2px; }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .hero-number {
      font-size: 36px;
      font-weight: 700;
      text-align: right;
    }
    .hero-number small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #cbd5e1;
    }
    .notice {
      background: #fff7e6;
      border: 1px solid #f3d6a0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 22px;
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      margin: 25px 0;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    button, input { font: inherit; }
    .tab, .save {
      cursor: pointer;
      background: white;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 14px;
      color: var(--text);
    }
    .tab.active {
      background: var(--accent);
      color: white;
    }
    input {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      min-width: 180px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 38px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card h2 { font-size: 19px; margin: 0; line-height: 1.45; }
    .card p { color: var(--muted); margin: 0; font-size: 14px; }
    .meta {
      font-size: 12px;
      color: var(--muted);
    }
    .category {
      color: var(--accent);
      background: #eef2ff;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 12px;
      width: fit-content;
    }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
    }
    .read {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      background: none;
      border: none;
      padding: 8px 0;
    }
    .save.saved { color: var(--accent); }
    dialog {
      border: none;
      border-radius: 16px;
      padding: 26px;
      width: min(650px, calc(100% - 24px));
      max-height: 85vh;
      overflow: auto;
      color: var(--text);
    }
    dialog::backdrop { background: #111827aa; }
    .dialog-top {
      display: flex;
      justify-content: flex-end;
    }
    .close {
      border: none;
      background: #f1f5f9;
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .detail-section { margin: 20px 0; }
    .detail-section h3 { margin-bottom: 4px; font-size: 15px; }
    .detail-section p { margin-top: 0; color: #475569; }
    a { color: var(--accent); overflow-wrap: anywhere; }
    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 25px;
    }
    @media(max-width: 700px) {
      header h1 { font-size: 26px; }
      .hero-number { font-size: 26px; }
      .grid { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; }
      input { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-row">
      <div>
        <div class="tagline">YOUR DAILY AI INTELLIGENCE</div>
        <h1>AI Frontier Radar</h1>
        <p>少而精的 AI 前沿资讯 · 深度产品解读</p>
        <div id="updated">演示版本 · 暂未连接实时数据</div>
      </div>
      <div class="hero-number">
        <span id="count">0</span>
        <small>条精选资讯</small>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="notice">
      当前是第一阶段网页原型。所有新闻均为虚构演示内容，
      尚未接入 RSS、GitHub API 或大模型。
    </div>

    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-tab="all">全部</button>
        <button class="tab" data-tab="apps">前沿应用</button>
        <button class="tab" data-tab="agent">Agent 落地</button>
        <button class="tab" data-tab="model">模型动态</button>
        <button class="tab" data-tab="github">GitHub</button>
        <button class="tab" data-tab="tutorial">AI 入门教程</button>
        <button class="tab" data-tab="saved">我的收藏</button>
      </div>
      <input id="search" placeholder="搜索资讯关键词...">
    </div>

    <section id="newsGrid" class="grid"></section>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-top">
      <button class="close" id="closeDialog">关闭 ✕</button>
    </div>
    <div id="detailContent"></div>
  </dialog>

  <footer>
    AI Frontier Radar · 个人学习项目<br>
    后续将支持每日北京时间 08:30 自动更新
  </footer>

  <script>
    // 第一阶段：数据已切换为news.json
   let news = [];
   let tutorials = [];


    async function loadNews() {
    const grid = document.getElementById("newsGrid");
    grid.textContent = "正在加载最新资讯...";

    try {
        const response = await fetch("./news.json", {
        cache: "no-store"
        });

        if (!response.ok) {
        throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        if (!Array.isArray(data.items)) {
        throw new Error("资讯数据格式不正确");
        }

        news = data.items;

        const updated = new Date(data.generated_at);
        document.getElementById("updated").textContent =
        "最近采集：" +
        (isNaN(updated.getTime())
            ? "未知"
            : updated.toLocaleString("zh-CN", {
                timeZone: "Asia/Shanghai"
            })) +
        "（北京时间）";

        document.querySelector(".notice").textContent =
        "以下内容来自公开信息源。当前展示原始标题与摘要，" +
        "尚未进行 AI 深度分析，请点击原文核实。";

        render();
    } catch (error) {
        grid.textContent =
        "资讯加载失败，请检查 news.json 和本地服务器。";
        console.error("加载失败：", error);
    }
    }


    const names = {
      apps: "前沿应用",
      agent: "Agent 落地",
      model: "模型动态",
      github: "GitHub"
    };

    const platforms = {
    bilibili: "B站",
    youtube: "YouTube",
    xiaohongshu: "小红书"
    };

    const difficulties = {
    beginner: "零基础",
    intermediate: "初级实操",
    advanced: "进阶项目"
    };

    async function loadTutorials() {
    try {
        const response = await fetch("./tutorials.json", {
        cache: "no-store"
        });

        if (!response.ok) {
        throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data.items)) {
        throw new Error("教程 JSON 格式不正确");
        }

        tutorials = data.items;
        render();
        console.log("教程加载成功：", tutorials.length);
    } catch (error) {
        console.error("教程加载失败：", error);
        tutorials = [];
        render();
    }
    }


    let currentTab = "all";
    let saved = [];

    try {
      saved = JSON.parse(localStorage.getItem("radarSaved") || "[]");
      if (!Array.isArray(saved)) saved = [];
    } catch {
      saved = [];
    }

    function renderTutorials() {
    const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

    const grid = document.getElementById("newsGrid");
    grid.replaceChildren();

    const filtered = tutorials.filter(item => {
        const text = [
        item.title,
        item.summary,
        item.topic,
        item.creator,
        platforms[item.platform],
        ...(item.learning_outcomes || [])
        ].join(" ").toLowerCase();

        return text.includes(keyword);
    });

    document.getElementById("count").textContent = filtered.length;

    if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "暂无符合条件的教程。";
        grid.appendChild(empty);
        return;
    }

    filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const category = document.createElement("span");
        category.className = "category";
        category.textContent =
        (platforms[item.platform] || item.platform) +
        " · " +
        (difficulties[item.difficulty] || "未分类");

        const title = document.createElement("h2");
        title.textContent = item.title;

        const summary = document.createElement("p");
        summary.textContent = item.summary || "";

        const topic = document.createElement("div");
        topic.className = "meta";
        topic.textContent =
        "主题：" + (item.topic || "未分类") +
        " · 作者：" + (item.creator || "未知");

        const outcomesTitle = document.createElement("strong");
        outcomesTitle.textContent = "学完你能掌握：";

        const outcomes = document.createElement("ul");
        (item.learning_outcomes || []).forEach(value => {
        const li = document.createElement("li");
        li.textContent = value;
        outcomes.appendChild(li);
        });

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const isVerified = item.verified === true &&
        typeof item.url === "string" &&
        /^https:\/\/.+/.test(item.url);

        if (isVerified) {
        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "read";
        link.textContent = "查看原教程 →";
        actions.appendChild(link);
        } else {
        const label = document.createElement("span");
        label.className = "meta";
        label.textContent = "演示内容 · 暂无可用教程链接";
        actions.appendChild(label);
        }

        card.append(
        category,
        title,
        summary,
        topic,
        outcomesTitle,
        outcomes,
        actions
        );

        grid.appendChild(card);
    });
    }

    function render() {
        if (currentTab === "tutorial") {
            renderTutorials();
            return;
        }
      const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

      const filtered = news.filter(item => {
        const matchTab = currentTab === "all"
          || item.category === currentTab
          || (currentTab === "saved" && saved.includes(item.id));

        const matchSearch = (
          item.title + " " + item.summary + " " + item.insight
        ).toLowerCase().includes(keyword);

        return matchTab && matchSearch;
      });

      document.getElementById("count").textContent = filtered.length;
      const grid = document.getElementById("newsGrid");
      grid.replaceChildren();

      if (filtered.length === 0) {
        const message = document.createElement("p");
        message.textContent = "没有找到符合条件的资讯。";
        grid.appendChild(message);
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "card";

        const category = document.createElement("span");
        category.className = "category";
        category.textContent = names[item.category];

        const title = document.createElement("h2");
        title.textContent = item.title;

        const summary = document.createElement("p");
        summary.textContent = item.summary;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = item.source + " · " + item.date;

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const read = document.createElement("button");
        read.className = "read";
        read.textContent = "阅读详细分析 →";
        read.addEventListener("click", () => openDetail(item));

        const save = document.createElement("button");
        save.className = "save";
        save.textContent = saved.includes(item.id) ? "★ 已收藏" : "☆ 收藏";
        if (saved.includes(item.id)) save.classList.add("saved");
        save.addEventListener("click", () => toggleSave(item.id));

        actions.append(read, save);
        card.append(category, title, summary, meta, actions);
        grid.appendChild(card);
      });
    }

    function toggleSave(id) {
      saved = saved.includes(id)
        ? saved.filter(value => value !== id)
        : [...saved, id];

      try {
        localStorage.setItem("radarSaved", JSON.stringify(saved));
      } catch {
        // 浏览器禁止本地存储时，本次页面仍可临时收藏
      }
      render();
    }

    function openDetail(item) {
      const content = document.getElementById("detailContent");
      content.replaceChildren();

      const heading = document.createElement("h2");
      heading.textContent = item.title;
      content.appendChild(heading);

      const fields = [
        ["核心内容", item.summary],
        ["主要变化", item.change],
        ["创新点", item.innovation],
        ["实际应用", item.practice],
        ["AI 产品经理视角", item.insight]
      ];

      fields.filter(([label, value]) => value)
  .forEach(([label, value]) => {
        const section = document.createElement("section");
        section.className = "detail-section";
        const h3 = document.createElement("h3");
        h3.textContent = label;
        const p = document.createElement("p");
        p.textContent = value;
        section.append(h3, p);
        content.appendChild(section);
      });

      if (item.url) {
        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "查看官方原文 →";
        content.appendChild(link);
      } else {
        const note = document.createElement("p");
        note.className = "meta";
        note.textContent = "演示数据，不提供真实原文链接。";
        content.appendChild(note);
      }

      document.getElementById("detailDialog").showModal();
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b =>
          b.classList.remove("active")
        );
        button.classList.add("active");
        currentTab = button.dataset.tab;
        render();
      });
    });

    document.getElementById("search")
      .addEventListener("input", render);

    document.getElementById("closeDialog")
      .addEventListener("click", () =>
        document.getElementById("detailDialog").close()
      );

    document.getElementById("detailDialog")
      .addEventListener("click", event => {
        if (event.target.id === "detailDialog") {
          event.target.close();
        }
      });

    loadNews();
    loadTutorials();
  </script>
</body>
</html>
