
name: Test Feishu connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Read Feishu records
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          app_id = os.environ["FEISHU_APP_ID"]
          app_secret = os.environ["FEISHU_APP_SECRET"]
          base_token = os.environ["FEISHU_BASE_TOKEN"]
          table_id = os.environ["FEISHU_TABLE_ID"]

          # 第一步：获取飞书应用访问凭证
          response = requests.post(
              "https://accounts.feishu.cn/oauth/v3/token",
              json={
                  "grant_type": "client_credentials",
                  "client_id": app_id,
                  "client_secret": app_secret,
              },
              timeout=30,
          )
          response.raise_for_status()
          token_data = response.json()
          token = token_data.get("access_token")

          if not token:
              raise RuntimeError(
                  "获取访问凭证失败，请检查 App ID、App Secret"
                  " 和飞书应用发布状态"
              )

          print("第一步成功：获取飞书访问凭证")

          # 第二步：读取学习资料库
          url = (
              "https://open.feishu.cn/open-apis/bitable/v1"
              f"/apps/{base_token}/tables/{table_id}/records"
          )

          records = []
          page_token = None

          while True:
              params = {"page_size": 100}
              if page_token:
                  params["page_token"] = page_token

              response = requests.get(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}"
                  },
                  params=params,
                  timeout=30,
              )
              response.raise_for_status()
              result = response.json()

              if result.get("code") != 0:
                  raise RuntimeError(
                      "读取飞书记录失败："
                      + str(result.get("msg"))
                      + "，错误码："
                      + str(result.get("code"))
                  )

              data = result.get("data") or {}
              records.extend(data.get("items") or [])

              if not data.get("has_more"):
                  break

              page_token = data.get("page_token")
              if not page_token:
                  raise RuntimeError("分页信息缺失")

          print("第二步成功：读取飞书学习资料库")
          print("资料总数：", len(records))

          # 第三步：检查已审核资料
          def as_text(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, list):
                  return "".join(map(as_text, value))
              if isinstance(value, dict):
                  return as_text(
                      value.get("text")
                      or value.get("value")
                      or ""
                  )
              return str(value or "")

          approved = [
              record for record in records
              if as_text(
                  (record.get("fields") or {}).get(
                      "处理状态"
                  )
              ).strip() == "已审核"
          ]

          print("已审核资料数量：", len(approved))

          if records:
              names = sorted(
                  (records[0].get("fields") or {}).keys()
              )
              print("第一条记录包含的字段名称：")
              print(", ".join(names))

          print("连接测试完成，未修改飞书或网站数据")
          PY
